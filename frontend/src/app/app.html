<div class="po-wrapper">
  <po-toolbar p-title="Minha Aplicação PO-UI"></po-toolbar>
  <po-menu [p-menus]="menus"></po-menu>

  <po-page-default p-title="Cadastro de Usuário">
    <p>Preencha os dados do usuário abaixo. Todos os campos são obrigatórios.</p>

    <form #formulario="ngForm" (ngSubmit)="salvar(formulario)">
      <!-- Monta o label para nome -->
      <po-input
        name="nome"
        p-label="Nome"
        p-placeholder="Digite seu nome"
        p-required
        p-pattern=".*\S.*"
        p-field-error-message="Informe um nome válido."
        [(ngModel)]="usuario.nome"
      ></po-input>

      <!-- Monta o label para e-mail -->
      <po-email
        name="email"
        p-label="E-mail do Usuário"
        p-placeholder="Digite seu e-mail"
        p-required
        [(ngModel)]="usuario.email"
      ></po-email>

      <!-- Monta o label para telefone -->
      <po-input
        name="telefone"
        p-label="Celular do Usuário"
        p-placeholder="Digite o DDD e o número"
        p-mask="(99) 99999-9999"
        p-mask-format-model="true"
        p-field-error-message="Informe o celular com DDD e 11 dígitos."
        p-required
        [(ngModel)]="usuario.telefone"
      ></po-input>

      <div class="acoes-usuario">
        <!-- Botão para incluir ou salvar a alteração do usuário -->
        <po-button
          [p-label]="usuarioEmEdicao !== null ? 'Salvar alteração' : 'Incluir'"
          p-kind="primary"
          [p-disabled]="formulario.invalid === true"
          (p-click)="salvar(formulario)"
        ></po-button>

        <!-- Botão de Alterar -->
        <po-button
          p-label="Alterar"
          (p-click)="alterarSelecionado()"
        ></po-button>

        <!-- Botão de Excluir -->
        <po-button
          p-label="Excluir"
          p-kind="danger"
          (p-click)="excluirSelecionados()"
        ></po-button>
      </div>

    </form>

    <!-- Campo de pesquisa de usuários -->
    <po-input
      name="filtroNome"
      p-label="Pesquisar usuário"
      p-placeholder="Digite parte do nome"
      [(ngModel)]="filtroNome"
    ></po-input>

    <!-- Botão para verificar usuários selecionados -->
    <po-button
      p-label="Verificar selecionados"
      (p-click)="verificarSelecionados()"
    ></po-button>


    <!-- Exibe a mensagem de status -->
    <p role="status" aria-live="polite">{{ mensagem }}</p>

    <!-- Exibe o último usuário salvo -->
    <!-- Lista todos os usuários cadastrados -->
    @if (usuarios.length > 0) {
    <section aria-label="Usuários cadastrados">
      <h2>Usuários cadastrados</h2>
        <po-table
          [p-columns]="colunasUsuarios"
          [p-items]="usuariosFiltrados"
          [p-sort]="true"
          [p-selectable]="true"
        ></po-table>
    </section>
    }
    <p><i class="fa fa-italic" aria-hidden="true">Etapa de estudo: os dados ficam em memória e são perdidos ao atualizar a página.</i></p>
  </po-page-default>
</div>
